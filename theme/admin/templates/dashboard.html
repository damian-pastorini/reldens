<div class="admin-dashboard" data-stats-path="dashboard/stats" data-refresh-ms="15000">
    <h2 class="section-title">Welcome to the Reldens Administration Panel!</h2>
    <div class="dashboard-servers sub-content">
        {{&serverUsage}}
    </div>
    <div class="dashboard-stats sub-content">
        <h3 class="dashboard-stats-title">Logged users</h3>
        <div class="dashboard-stats-boxes">
            <div class="dashboard-chart">
                <h4 class="chart-title">Last 30 days</h4>
                <div class="chart-canvas-wrapper">
                    <canvas class="daily-logins-chart" width="920" height="260"></canvas>
                    <div class="chart-tooltip hidden"></div>
                </div>
            </div>
            <div class="stat-tile active-users-tile">
                <span class="stat-label">Currently logged</span>
                <span class="stat-value active-users-count">-</span>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/js/admin-dashboard-stats-renderer.js"></script>
